[project]
name = "chronicle-ds"
version = "0.1.0"
description = "The web scraping library that remembers — DS-native data acquisition with temporal versioning and drift detection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Benedict Chidiebere", email = "benedict.c.works@gmail.com" }
]
keywords = ["web scraping", "data science", "drift detection", "data quality", "pandas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.6",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "scipy>=1.11",       # for KS test / drift detection
    "typer>=0.12",       # CLI
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
]
browser = [
    "playwright>=1.43",  # optional JS rendering
]

[project.scripts]
chronicle = "chronicle.cli:app"

[project.urls]
Homepage = "https://github.com/TheDataNormad/chronicle"
Issues = "https://github.com/TheDataNormad/chronicle/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicle"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=chronicle --cov-report=term-missing"